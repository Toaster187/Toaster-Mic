[package]
name = "toaster-android-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Toaster Mic Android audio engine (background process, no UI)"

[lib]
name = "toaster_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
toaster-core.workspace = true
toaster-android-audio.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
libc.workspace = true
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
